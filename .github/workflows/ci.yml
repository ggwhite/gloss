name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version && swift --version
      - name: Unit tests
        run: swift test
      - name: Self-test (drives a demo quiz off-screen)
        run: |
          swift build
          "$(swift build --show-bin-path)/Gloss" --self-test self-test.json
